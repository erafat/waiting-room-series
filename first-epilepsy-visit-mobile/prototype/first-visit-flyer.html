<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waiting Room Comic Flyer</title>
  <style>
    :root {
      --ink: #221b18;
      --muted: #5f554f;
      --paper: rgba(255, 249, 239, 0.68);
      --paper-solid: #fff9ef;
      --blue: #1f4e79;
      --line: rgba(34, 27, 24, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ddd5ca;
      color: var(--ink);
      font-family: Avenir, "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    }

    .sheet {
      width: 8.5in;
      height: 11in;
      margin: 0 auto;
      padding: 0.46in;
      position: relative;
      overflow: hidden;
      background: #f4eadb;
    }

    .sheet::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("../assets/generated/01-hero-cover.png") center / cover no-repeat;
      transform: scale(1.03);
    }

    .sheet::after {
      content: "";
      position: absolute;
      inset: 0.22in;
      border: 3px solid rgba(34, 27, 24, 0.22);
      border-radius: 18px;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      min-height: 10.08in;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 0.26in;
    }

    .brand-row {
      min-height: 0.65in;
    }

    .main {
      display: grid;
      grid-template-columns: 1fr 3.05in;
      gap: 0.32in;
      align-items: end;
      align-self: end;
    }

    .copy-card {
      align-self: end;
      padding: 0.22in 0.28in;
      border-radius: 16px;
      background: var(--paper);
      box-shadow: 0 16px 36px rgba(52, 37, 24, 0.11);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      min-height: 0;
      backdrop-filter: blur(2px);
    }

    h1 {
      margin: 0;
      max-width: 13ch;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 31pt;
      line-height: 0.95;
      letter-spacing: 0;
    }

    .dek {
      margin: 0.14in 0 0;
      max-width: 34ch;
      font-size: 13.4pt;
      line-height: 1.16;
      font-weight: 750;
      color: var(--muted);
    }

    .optional {
      margin-top: 0.14in;
      padding-top: 0.12in;
      border-top: 2px solid rgba(34, 27, 24, 0.12);
      font-size: 17pt;
      line-height: 1.2;
      color: var(--ink);
      font-weight: 950;
    }

    .qr-card {
      align-self: end;
      padding: 0.22in;
      border: 4px solid rgba(34, 27, 24, 0.78);
      border-radius: 18px;
      background: var(--paper-solid);
      box-shadow: 0 16px 36px rgba(52, 37, 24, 0.18);
      display: grid;
      justify-items: center;
      gap: 0.12in;
    }

    .qr-title {
      margin: 0;
      font-size: 21pt;
      line-height: 1;
      font-weight: 950;
      text-align: center;
    }

    .qr {
      width: 2.82in;
      height: 2.82in;
      padding: 0.08in;
      border: 2px solid rgba(34, 27, 24, 0.18);
      background: white;
    }

    .qr img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }

    @page {
      size: Letter;
      margin: 0;
    }

    @media print {
      body {
        background: white;
      }

      .sheet {
        margin: 0;
        box-shadow: none;
      }
    }

    @media screen {
      .sheet {
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.25);
      }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="content">
      <header class="brand-row">
      </header>

      <section class="main" aria-label="Patient guide flyer">
        <div class="copy-card">
          <h1>Are you seeing Dr. Erafat Rehim today?</h1>
          <p class="dek">Waiting for your visit? Here&rsquo;s something about what to expect during your appointment.</p>

          <p class="optional">This is optional</p>
        </div>

        <aside class="qr-card" aria-label="QR code">
          <p class="qr-title">Scan the code if you have 5 minutes</p>
          <div class="qr">
            <img src="../assets/generated/Erafat-qr-code.png" alt="QR code for the appointment comic">
          </div>
        </aside>
      </section>

    </div>
  </main>
</body>
</html>
